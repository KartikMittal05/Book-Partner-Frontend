<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="navbar">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm sticky-top">

        <a th:href="@{/}" class="navbar-brand fw-bold fs-5">
            <span class="text-warning">Book</span><span class="text-white">Store</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">

        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a th:href="@{/}" class="nav-link" th:classappend="${activePage == 'home'} ? 'active fw-semibold'">

                    </a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/authors}" class="nav-link"
